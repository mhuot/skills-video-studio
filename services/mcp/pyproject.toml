[project]
name = "skills-video-studio-mcp"
version = "0.1.0"
description = "MCP stdio server fronting the Skills Video Studio API"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.1",
]

[project.scripts]
studio-mcp = "studio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_mcp"]
