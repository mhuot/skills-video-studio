name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            component: studio
            target: all-in-one
            image: ghcr.io/mhuot/skills-video-studio
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            component: studio
            target: all-in-one
            image: ghcr.io/mhuot/skills-video-studio
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            component: api
            target: api
            image: ghcr.io/mhuot/skills-video-studio-api
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            component: api
            target: api
            image: ghcr.io/mhuot/skills-video-studio-api
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
            component: web
            target: web
            image: ghcr.io/mhuot/skills-video-studio-web
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            component: web
            target: web
            image: ghcr.io/mhuot/skills-video-studio-web
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    strategy:
      matrix:
        include:
          - component: studio
            image: ghcr.io/mhuot/skills-video-studio
          - component: api
            image: ghcr.io/mhuot/skills-video-studio-api
          - component: web
            image: ghcr.io/mhuot/skills-video-studio-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: digests-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest
      - name: Create multi-architecture manifest
        env:
          IMAGE: ${{ matrix.image }}
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "${TAGS_JSON}")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "${tag}")
          done
          sources=()
          for digest in /tmp/digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "${digest}")")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME#v}"
